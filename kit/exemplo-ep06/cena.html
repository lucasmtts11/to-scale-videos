const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
function spring(t, f = 1.6, z = 0.6) { if (t <= 0) return 0; const w = 2*Math.PI*f, wd = w*Math.sqrt(1-z*z); return 1 - Math.exp(-z*w*t)*(Math.cos(wd*t) + (z*w/wd)*Math.sin(wd*t)); }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function wordTime(seg, w, nth = 0) {
  const list = TL.words.filter(x => x.seg === seg && x.w.toLowerCase().replace(/[^a-zà-ú0-9]/g, "").startsWith(w));
  return list.length ? list[Math.min(nth, list.length - 1)].s : null;
}

// ================= latas instanciadas (pirâmide 7² + 6² + ... + 1² = 140, + 3 no topo = 143) =================
const CR = 0.055, CH = 0.19;
function canGeo(body, band, topc) {
  const parts = [[new THREE.CylinderGeometry(CR, CR, CH * 0.78, 10), body, [0, 0, 0]], [new THREE.CylinderGeometry(CR * 1.01, CR * 1.01, CH * 0.12, 10), band, [0, 0.01, 0]], [new THREE.CylinderGeometry(CR * 0.85, CR, CH * 0.11, 10), topc, [0, CH * 0.445, 0]], [new THREE.CylinderGeometry(CR, CR * 0.85, CH * 0.11, 10), topc, [0, -CH * 0.445, 0]]];
  const pos = [], nor = [], col = [];
  for (const [g0, c, o] of parts) { const g = g0.toNonIndexed(); g.translate(...o); pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); for (let i = 0; i < g.attributes.position.count; i++) col.push(...c); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); return g;
}

cans.castShadow = waters.castShadow = true; cans.frustumCulled = waters.frustumCulled = false; scene.add(cans, waters);
const SLOTS = [];
{ const sp = 0.118; let L = 0;
  for (let n = 7; n >= 1; n--, L++) for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) SLOTS.push([(i - (n - 1) / 2) * sp, L * CH + CH / 2, (j - (n - 1) / 2) * sp]);
  for (let k = 0; k < 3; k++) SLOTS.push([(k - 1) * 0.12, 7 * CH + CH / 2, 0.0]);
}
// t0: chegada (cai do alto com mola, escalonado por camada); gone: quantas latas (do topo) já foram bebidas
function drawCans(mesh, t, t0, gone = 0, wob = 0) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3(1, 1, 1), e = new THREE.Euler();
  for (let i = 0; i < NCAN; i++) {
    const p = SLOTS[i];
    if (t0 == null || i >= NCAN - gone) { m.makeScale(0, 0, 0); mesh.setMatrixAt(i, m); continue; }
    const d = (i / NCAN) * 0.9;
    const k = spring(t - t0 - d, 1.7, 0.55);
    if (t - t0 - d <= 0) { m.makeScale(0, 0, 0); mesh.setMatrixAt(i, m); continue; }
    e.set(wob * Math.sin(t * 9 + i) * 0.05, hash(i) * 6, wob * Math.cos(t * 8 + i) * 0.05); q.setFromEuler(e);
    v.set(TABLE_X + p[0], TABLE_Y + p[1] + 1.6 * (1 - k), TABLE_Z + p[2]); m.compose(v, q, s); mesh.setMatrixAt(i, m);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

const splash = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05, 0), M(0xC9D84A, { roughness: 0.3 }), NSP); splash.frustumCulled = false; scene.add(splash);
function drawSplash(t, t0, origin) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < NSP; i++) {
    const u = t0 == null ? -1 : t - t0 - (i % 10) * 0.04;
    if (u < 0 || u > 1.3) { m.makeScale(0, 0, 0); splash.setMatrixAt(i, m); continue; }
    const vx = (hash(i) - .5) * 1.0, vz = 1.2 + hash(i + 3) * 1.4, vy = 0.6 + hash(i + 6) * 1.2;
    const y = Math.max(0.03, origin.y + vy * u - 4.9 * u * u);
    v.set(origin.x + vx * u, y, origin.z + vz * u); s.setScalar(0.8 + hash(i + 9)); m.compose(v, q, s); splash.setMatrixAt(i, m);
  }
  splash.instanceMatrix.needsUpdate = true;
}
