// ================= utilitários =================
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
function spring(t, f = 1.6, z = 0.6) { if (t <= 0) return 0; const w = 2*Math.PI*f, wd = w*Math.sqrt(1-z*z); return 1 - Math.exp(-z*w*t)*(Math.cos(wd*t) + (z*w/wd)*Math.sin(wd*t)); }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function wordTime(seg, w, nth = 0) {
  const list = TL.words.filter(x => x.seg === seg && x.w.toLowerCase().replace(/[^a-zà-ú0-9]/g, "").startsWith(w));
  return list.length ? list[Math.min(nth, list.length - 1)].s : null;
}

const M = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: true, ...extra });

function textTex(lines, w = 512, h = 256, bg = "#fff", fg = "#222", size = 70) {
  const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
  g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle"; g.font = `900 ${size}px Inter, sans-serif`;
  lines.forEach((l, i) => g.fillText(l, w / 2, h / 2 + (i - (lines.length - 1) / 2) * size * 1.1));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// textura de tablete de chocolate (quadradinhos em relevo)
function tabletTex(base, light, dark, nx = 2, ny = 2, rx = 1, ry = 1) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.fillStyle = dark; g.fillRect(0, 0, 256, 256);
  const cw = 256 / nx, ch = 256 / ny;
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) {
    const x = i * cw + 6, y = j * ch + 6, w = cw - 12, h = ch - 12;
    g.fillStyle = light; g.fillRect(x, y, w, h);
    g.fillStyle = base; g.fillRect(x + 8, y + 8, w - 12, h - 12);
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.colorSpace = THREE.SRGBColorSpace; return t;
}

// ---- quintal: grama, árvores, cerca
{

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30); t.colorSpace = THREE.SRGBColorSpace;

  const path = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 9), M(0xCDB894)); path.rotation.x = -Math.PI / 2; path.position.set(1.0, 0.01, 7.0); path.receiveShadow = true; scene.add(path);
  for (let i = 0; i < 16; i++) {

}

  const g = new THREE.ExtrudeGeometry(sh, { depth: 0.3, bevelEnabled: false, curveSegments: 1 }); g.rotateY(Math.PI / 2); g.translate(sx * 2.85 - 0.15, 2.8, 0);
  part(g, matGable, "wall", 4);
}
const roofF = part(new THREE.BoxGeometry(6.8, 0.22, 3.5, 16, 1, 8).rotateX(RA).translate(0, 3.6, 1.45), matRoof, "roof", 6);
const roofB = part(new THREE.BoxGeometry(6.8, 0.22, 3.5, 16, 1, 8).rotateX(-RA).translate(0, 3.6, -1.45), matRoof, "roof", 7);
part(new THREE.BoxGeometry(0.55, 1.1, 0.55, 2, 4, 2).translate(-1.8, 4.1, -0.9), matRoof, "roof", 8);
const door = part(new THREE.BoxGeometry(0.95, 1.95, 0.12, 2, 6, 1).translate(1.0, 0.975, 2.55), matDoor, "door", 5);
const knob = part(new THREE.SphereGeometry(0.06, 8, 6).translate(1.32, 0.95, 2.63), matWhite, "door", 5);
const winF = part(new THREE.BoxGeometry(1.3, 1.0, 0.1, 4, 3, 1).translate(-1.5, 1.6, 2.53), matWhite, "win", 5);
const winG = part(new THREE.BoxGeometry(1.0, 0.72, 0.1).translate(-1.5, 1.6, 2.56), matGlass, "win", 5);
const winS = part(new THREE.BoxGeometry(1.3, 1.0, 0.1, 4, 3, 1).translate(2.92, 1.6, -0.6).rotateY(0), matWhite, "win2", 5);
// (janela lateral do lado do sol)
winS.mesh.geometry.rotateY(Math.PI / 2); winS.mesh.geometry.translate(0, 0, 0);
{ const g = winS.mesh.geometry; g.computeBoundingBox(); const bb = g.boundingBox; const cx = (bb.min.x + bb.max.x) / 2, cz = (bb.min.z + bb.max.z) / 2; g.translate(3.03 - cx, 0, -0.6 - cz); winS.base = Float32Array.from(g.attributes.position.array); }

const noise = (x, z) => 0.5 + 0.5 * Math.sin(x * 2.3 + z * 1.7) * Math.cos(z * 2.9 - x * 1.1);
const ST = { mW: 0, mR: 0, tilt: 0, sag: 0, drop: 0, doorRot: 0, winSlide: 0, rise: null, t: 0 };
// deforma um ponto da casa conforme o derretimento
function deformPt(kind, x, y, z, out) {
  const s = clamp((x + 3.3) / 6.6);
  if (kind === "door") { const px = 0.52, py = 0, a = ST.doorRot; const dx = x - px, dy = y - py; x = px + dx * Math.cos(a) - dy * Math.sin(a); y = py + dx * Math.sin(a) + dy * Math.cos(a); }
  if (kind === "win") { y -= ST.winSlide; x += ST.winSlide * 0.25; }
  if (kind === "win2") { y -= ST.winSlide * 1.3; }
  const f = ST.mW * (0.3 + 0.7 * s);
  let yy, xx = x, zz = z;
  if (kind === "roof") {
    const fTop = f; yy = y - 2.8 * 0.55 * fTop - ST.sag * (1 - Math.pow(x / 3.4, 2)) * (1 - Math.abs(z) / 3.2) - ST.mR * 0.22 * noise(x, z);
    if (Math.abs(z) > 2.3) yy -= ST.mR * 0.5 * (Math.abs(z) - 2.3);
    if (ST.drop > 0) { yy = lerp(yy, 0.45 + 0.25 * noise(x * 1.3, z) + 0.15 * (1 - Math.abs(z) / 3.2), ST.drop); xx *= 1 + 0.12 * ST.drop; zz *= 1 + 0.18 * ST.drop; }
  } else {
    yy = y * (1 - 0.55 * f) - f * 0.14 * noise(x, z) * (y / 2.8);
    if (ST.drop > 0) yy *= 1 - 0.65 * ST.drop;
  }
  const r = Math.pow(1 - clamp(yy / 2.8), 2), sp = f + 0.6 * ST.drop;
  xx *= 1 + 0.14 * sp * r; zz *= 1 + 0.2 * sp * r;
  xx += ST.tilt * yy;
  out.set(xx, yy, zz); return out;
}
const _v = new THREE.Vector3();
const bigDrop = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshStandardMaterial({ color: 0x5A2D14, roughness: 0.22 })); scene.add(bigDrop);
function updateHouse() {
  for (const p of PARTS) {
    const pos = p.mesh.geometry.attributes.position, b = p.base, a = pos.array;
    for (let i = 0; i < b.length; i += 3) { deformPt(p.kind, b[i], b[i + 1], b[i + 2], _v); a[i] = _v.x; a[i + 1] = _v.y; a[i + 2] = _v.z; }
    pos.needsUpdate = true; p.mesh.geometry.computeVertexNormals();
    // chegada (construção): cai do alto com mola, escalonado
    if (ST.rise != null) { const k = spring(ST.t - ST.rise - p.order * 0.18, 1.5, 0.55); p.mesh.position.y = 6 * (1 - k); p.mesh.visible = ST.t - ST.rise - p.order * 0.18 > 0; }
    else { p.mesh.position.y = 0; p.mesh.visible = true; }
  }
}
// pingos: escorridos (cilindros) e gotas caindo
const DRIPS = [];
for (let i = 0; i < 15; i++) DRIPS.push({ k: "roof", x: -3.2 + i * 0.46, y: 2.66, z: 2.86 });
for (let i = 0; i < 15; i++) DRIPS.push({ k: "roof", x: -3.2 + i * 0.46, y: 2.66, z: -2.86 });
for (let i = 0; i < 10; i++) DRIPS.push({ k: "wall", x: 3.01, y: 2.75, z: -2.0 + i * 0.45 });

const dripMat = new THREE.MeshStandardMaterial({ color: 0x5A2D14, roughness: 0.22 });
const dripMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.035, 0.06, 1, 6).translate(0, -0.5, 0), dripMat, ND);
const dropMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.07, 8, 6), dripMat, ND);
dripMesh.frustumCulled = dropMesh.frustumCulled = false; dripMesh.castShadow = true; scene.add(dripMesh, dropMesh);
function drawDrips(t, amount, drops = true) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
  for (let i = 0; i < ND; i++) {
    const d = DRIPS[i];
    const a = clamp(amount * (0.5 + hash(i) * 0.9) - (d.k === "wall" ? 0.35 : 0));
    if (a <= 0.02 || ST.drop > 0.2) { m.makeScale(0, 0, 0); dripMesh.setMatrixAt(i, m); dropMesh.setMatrixAt(i, m); continue; }
    deformPt(d.k, d.x, d.y, d.z, v); if (d.k === "wall") v.x += 0.03;
    const L = a * (d.k === "wall" ? 1.6 : 0.9) * (0.6 + 0.6 * hash(i + 7));
    s.set(1 + a, L, 1 + a); m.compose(v, q, s); dripMesh.setMatrixAt(i, m);
    const per = 0.8 + hash(i + 3) * 0.7, u = ((t + hash(i + 11) * 3) % per) / per, fall = (v.y - L) * easeIn(u);
    if (drops && a > 0.25) { s.setScalar(0.8 + a * 0.6); v.y = Math.max(0.05, v.y - L - fall); m.compose(v, q, s); dropMesh.setMatrixAt(i, m); }
    else { m.makeScale(0, 0, 0); dropMesh.setMatrixAt(i, m); }
  }
  dripMesh.instanceMatrix.needsUpdate = dropMesh.instanceMatrix.needsUpdate = true;
}
// poça e rio de chocolate (manchas achatadas)
const pudMat = new THREE.MeshStandardMaterial({ color: 0x4E260F, roughness: 0.18 });
const puddles = [];
for (let i = 0; i < 9; i++) { const p = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 8), pudMat); p.receiveShadow = true; scene.add(p); puddles.push(p); }
function drawPuddle(r, river) {
  puddles.forEach((p, i) => {
    if (i < 5) { const a = i / 5 * Math.PI * 2, R = r * (0.9 + 0.3 * hash(i)); p.visible = r > 0.02; p.position.set(Math.cos(a) * r * 0.6 + 0.4, 0.0, Math.sin(a) * r * 0.5); p.scale.set(R, 0.05, R * 0.8); }
    else { const k = clamp(river * 4 - (i - 5)); p.visible = k > 0.01; p.position.set(1.0 + Math.sin(i) * 0.6, 0.0, 3.6 + (i - 5) * 2.6 * k); p.scale.set(1.2 + 0.3 * hash(i), 0.055, 2.0 * k + 0.1); }
  });

// respingos (no desabamento)
const NSP = 60;

  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < NSP; i++) {
    const u = t0 == null ? -1 : t - t0 - (i % 6) * 0.03;

  }
  splash.instanceMatrix.needsUpdate = true;
}

  const lab = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 0.7), new THREE.MeshBasicMaterial({ map: textTex(["~17 t"], 512, 200, "#FFD21F", "#111", 130) })); lab.position.set(0, 1.4, 1.21); stack.add(lab); }

function person() {

  const torso = box(0.5, 0.66, 0.28, GM(0x3D7CC9)); torso.position.y = 1.19; body.add(torso);
  const vest = box(0.52, 0.5, 0.3, GM(0xFF8A1E)); vest.position.y = 1.2; body.add(vest);

  for (const sx of [-1, 1]) {

  }
  const head = new THREE.Group(); head.position.y = 1.68; g.add(head); P.head = head;
  const skinMat = GM(SKIN); P.skinMat = skinMat;
  const hd = new THREE.Mesh(new THREE.SphereGeometry(0.155, 14, 10), skinMat); hd.scale.set(1, 1.15, 1); hd.castShadow = true; head.add(hd);
  for (const sx of [-1, 1]) { const e = box(0.035, 0.04, 0.02, GM(0x111111)); e.position.set(sx * 0.055, 0.03, 0.15); head.add(e); P[sx < 0 ? "eyeL" : "eyeR"] = e; }
  const mouth = box(0.07, 0.02, 0.02, GM(0x7A2E2E)); mouth.position.set(0, -0.06, 0.15); head.add(mouth); P.mouth = mouth;

  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.025, 16), GM(0xFFD21F)); brim.position.set(0, 0.05, 0.03); head.add(brim);
  // mancha de chocolate no capacete (depois do pingo)

  const bar = new THREE.Mesh(barGeo, matWall); bar.position.set(0, -0.72, 0.08); bar.rotation.x = Math.PI / 2; P.armR.add(bar); P.bar = bar;
  // colher gigante
  const spoon = new THREE.Group(); const st = cyl(0.025, 0.025, 0.7, 6, M(0xC8CDD6, { metalness: 0.6, roughness: 0.3 })); st.position.y = 0.2; spoon.add(st);
  const bowl = new THREE.Mesh(new THREE.SphereGeometry(0.11, 10, 6), M(0xC8CDD6, { metalness: 0.6, roughness: 0.3 })); bowl.scale.set(1, 0.4, 1.4); bowl.position.y = -0.18; spoon.add(bowl);
  spoon.position.set(0, -0.7, 0.05); P.armR.add(spoon); P.spoon = spoon;
  g.userData.P = P; return g;
}
