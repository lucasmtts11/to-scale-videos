const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
function spring(t, f = 1.6, z = 0.6) { if (t <= 0) return 0; const w = 2*Math.PI*f, wd = w*Math.sqrt(1-z*z); return 1 - Math.exp(-z*w*t)*(Math.cos(wd*t) + (z*w/wd)*Math.sin(wd*t)); }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function wordTime(seg, w, nth = 0) {
  const list = TL.words.filter(x => x.seg === seg && x.w.toLowerCase().replace(/[^a-zà-ú0-9]/g, "").startsWith(w));
  return list.length ? list[Math.min(nth, list.length - 1)].s : null;
}

function picanhaGeo() {
  const parts = [[new THREE.BoxGeometry(0.34, 0.1, 0.2), [0.40, 0.11, 0.07], 0], [new THREE.BoxGeometry(0.34, 0.045, 0.2), [0.92, 0.76, 0.50], 0.072], [new THREE.BoxGeometry(0.30, 0.012, 0.03), [0.25, 0.08, 0.05], 0.052]];
  const pos = [], nor = [], col = [];
  for (const [g0, c, y] of parts) {
    const g = g0.toNonIndexed(); g.translate(0, y, 0);
    if (g0 === parts[2][0]) g.translate(0, 0, 0.0);
    pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array);
    for (let i = 0; i < g.attributes.position.count; i++) col.push(...c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  return g;
}

const pieces = [];
{
  let i = 0;
  for (let L = 0; L < 9 && i < NP; L++) {
    const r = 1.0 * (1 - L / 9.5), n = Math.max(3, Math.round(22 * (1 - L / 9)));
    for (let k = 0; k < n && i < NP; k++, i++) {
      const a = (k / n) * Math.PI * 2 + L * 0.7 + hash(i) * 0.4, rr = r * (0.25 + 0.75 * Math.sqrt(hash(i + 13)));
      pieces.push({ x: Math.cos(a) * rr * 1.15, z: Math.sin(a) * rr * 0.5, y: 1.05 + L * 0.12 + hash(i + 3) * 0.03, ry: hash(i + 7) * 6.3, rx: (hash(i + 9) - 0.5) * 0.5, rz: (hash(i + 11) - 0.5) * 0.4, L });
    }
  }
  pieces.sort((a, b) => b.y - a.y); // come de cima para baixo
}
const PILE_TOP = 1.05 + 8 * 0.12;
function drawPile(visible, flyK = 0, mouth = null, t = 0) {
  // visible: quantas peças ainda na mesa (de baixo para cima); as do topo somem primeiro
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  const off = NP - Math.round(visible);
  for (let i = 0; i < NP; i++) {
    const p = pieces[i];
    if (i < off) { m.makeScale(0, 0, 0); pile.setMatrixAt(i, m); continue; }
    e.set(p.rx, p.ry, p.rz); q.setFromEuler(e);
    m.compose(new THREE.Vector3(p.x, p.y, p.z), q, new THREE.Vector3(1, 1, 1)); pile.setMatrixAt(i, m);
  }
  pile.instanceMatrix.needsUpdate = true;
}

function drawFlyers(t, t0, t1, mouthW) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let i = 0; i < NF; i++) {
    const u = ((t - t0) * 2.2 + i / NF) % 1;
    if (t < t0 || t > t1) { m.makeScale(0, 0, 0); flyers.setMatrixAt(i, m); continue; }
    const a = [table.position.x + (hash(i) - 0.5) * 1.2, 1.4, table.position.z + (hash(i + 4) - 0.5) * 0.5];
    const x = lerp(a[0], mouthW.x, u), z = lerp(a[2], mouthW.z, u), y = lerp(a[1], mouthW.y, u) + Math.sin(u * Math.PI) * 0.8;
    const s = 1 - 0.7 * u;
    q.setFromEuler(new THREE.Euler(u * 8 + i, u * 5, i)); m.compose(new THREE.Vector3(x, y, z), q, new THREE.Vector3(s, s, s)); flyers.setMatrixAt(i, m);
  }
  flyers.instanceMatrix.needsUpdate = true;
}

  const sk = [0xE3B08C, 0xC98E66, 0x8D5B3E, 0xF0C9A8]; for (let i = 0; i < NG; i++) gHead.setColorAt(i, c.setHex(sk[i % 4])); gHead.instanceColor.needsUpdate = true; }

for (let i = 0; i < NG; i++) { const row = i < 13 ? 0 : i < 25 ? 1 : 2, idx = row === 0 ? i : row === 1 ? i - 13 : i - 25, n = row === 0 ? 13 : 12; guests.push([-4.2 + idx * (8.4 / (n - 1)) + (row === 1 ? 0.3 : 0), -1.6 - row * 0.9]); }
function drawGuests(t, t0) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  for (let i = 0; i < NG; i++) {
    const s = t0 == null ? 0 : clamp(spring(t - t0 - i * 0.045, 2.0, 0.55));
    const [x, z] = guests[i], sv = new THREE.Vector3(s, s, s);
    if (s <= 0.001) { m.makeScale(0, 0, 0); gBody.setMatrixAt(i, m); gHead.setMatrixAt(i, m); continue; }

    m.compose(new THREE.Vector3(x, 0.55 * s + hop, z), q, sv); gBody.setMatrixAt(i, m);
    m.compose(new THREE.Vector3(x, 1.27 * s + hop, z), q, sv); gHead.setMatrixAt(i, m);
  }
  gBody.instanceMatrix.needsUpdate = gHead.instanceMatrix.needsUpdate = true;
}
