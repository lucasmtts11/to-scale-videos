<script type="module">

const SEG = Object.fromEntries(TL.segs.map(s => [s.id, s]));

// ================= utilitários =================
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = x => Math.pow(clamp(x), 2);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
function spring(t, f = 1.6, z = 0.6) { if (t <= 0) return 0; const w = 2*Math.PI*f, wd = w*Math.sqrt(1-z*z); return 1 - Math.exp(-z*w*t)*(Math.cos(wd*t) + (z*w/wd)*Math.sin(wd*t)); }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function wordTime(seg, w, nth = 0) {
  const list = TL.words.filter(x => x.seg === seg && x.w.toLowerCase().replace(/[^a-zà-ú0-9]/g, "").startsWith(w));
  return list.length ? list[Math.min(nth, list.length - 1)].s : null;
}

// ================= renderer / cenas =================
const glCanvas = document.createElement("canvas"); glCanvas.id = "gl"; document.body.appendChild(glCanvas);
const renderer = new THREE.WebGLRenderer({ canvas: glCanvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
{
  const c = document.createElement("canvas"); c.width = 4; c.height = 256; const g = c.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "#5FA8E6"); gr.addColorStop(0.55, "#BFE0F5"); gr.addColorStop(1, "#D6EAF4");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; scene.background = tex;
}
scene.fog = new THREE.Fog(0xD3E6F0, 40, 140);
const camera = new THREE.PerspectiveCamera(50, W / H, 0.6, 3000);
scene.add(new THREE.HemisphereLight(0xFFF6EA, 0x7E9A62, 1.35));
const sun = new THREE.DirectionalLight(0xFFE9C8, 2.4);
sun.position.set(8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 40 }); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
scene.add(sun);
const M = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, flatShading: true, ...extra });
const box = (w, h, d, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.castShadow = m.receiveShadow = true; return m; };
const cyl = (rt, rb, h, seg, mat) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.castShadow = m.receiveShadow = true; return m; };

// chão: campo verde enorme + praça de concreto
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), M(0x8DBF5A)); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
// "tapete" de gente: quadrado gigante visto do alto (textura de pontinhos coloridos)
const SQ = 220, SQZ = -2 - SQ / 2;   // quadrado começa logo atrás do boneco
const SHIRTS = ["#FFD21F", "#1E9E52", "#3D7CC9", "#F4F1EA", "#E0383E", "#FFD21F", "#1E9E52"];
const carpetTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 512; const g = c.getContext("2d");
  g.fillStyle = "#6E6A66"; g.fillRect(0, 0, 512, 512);
  for (let y = 0; y < 32; y++) for (let x = 0; x < 32; x++) { const i = y * 32 + x; g.fillStyle = SHIRTS[Math.floor(hash(i + 3) * SHIRTS.length)]; g.beginPath(); g.arc(x * 16 + 8 + (hash(i) - .5) * 5, y * 16 + 8 + (hash(i + 9) - .5) * 5, 6, 0, Math.PI * 2); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(SQ / 16, SQ / 16); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
})();
const carpet = new THREE.Mesh(new THREE.PlaneGeometry(SQ, SQ), new THREE.MeshStandardMaterial({ map: carpetTex, roughness: 1 }));
carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, 0.08, SQZ); carpet.receiveShadow = false; scene.add(carpet);
// contorno amarelo do quadrado
const outline = new THREE.Group(); scene.add(outline);
{ const mat = new THREE.MeshBasicMaterial({ color: 0xFFD21F }); const th = 1.6;
  for (const [w, d, x, z] of [[SQ + th, th, 0, SQZ - SQ / 2], [SQ + th, th, 0, SQZ + SQ / 2], [th, SQ + th, -SQ / 2, SQZ], [th, SQ + th, SQ / 2, SQZ]]) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.3, d), mat); b.position.set(x, 0.2, z); outline.add(b); } }
outline.visible = false;

// ================= multidão (instanciada, perto da câmera) =================
const CX = 76, CZ = 40, NC = CX * CZ, SP = 0.5;
const cBody = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.17, 0.2, 1.05, 6), M(0xFFFFFF), NC);
const cHead = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.14, 0), M(0xFFFFFF), NC);
const cArm = new THREE.InstancedMesh(new THREE.BoxGeometry(0.08, 0.5, 0.08), M(0xFFFFFF), NC);
scene.add(cBody, cHead, cArm); cBody.frustumCulled = cHead.frustumCulled = cArm.frustumCulled = false;
const crowd = [];
{ const c = new THREE.Color(); const sk = [0xE3B08C, 0xC98E66, 0x8D5B3E, 0xF0C9A8, 0xB57A55];
  for (let i = 0; i < NC; i++) {
    const ix = i % CX, iz = Math.floor(i / CX);
    const x = (ix - (CX - 1) / 2) * SP + (hash(i) - .5) * 0.18, z = -2.2 - iz * SP + (hash(i + 77) - .5) * 0.18;
    crowd.push({ x, z, ph: hash(i + 5), s: 0.9 + hash(i + 8) * 0.25 });
    cBody.setColorAt(i, c.set(SHIRTS[Math.floor(hash(i + 3) * SHIRTS.length)])); cHead.setColorAt(i, c.setHex(sk[i % 5])); cArm.setColorAt(i, c.setHex(sk[i % 5]));
  }
  cBody.instanceColor.needsUpdate = cHead.instanceColor.needsUpdate = cArm.instanceColor.needsUpdate = true; }
cBody.castShadow = cHead.castShadow = true; cBody.receiveShadow = true;
function drawCrowd(t, jump, opt = {}) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sv = new THREE.Vector3();
  for (let i = 0; i < NC; i++) {
    const p = crowd[i], s = p.s;
    const jitter = opt.walk ? Math.abs(Math.sin(t * 7 + p.ph * 20)) * 0.06 : Math.abs(Math.sin(t * 3 + p.ph * 20)) * 0.05;
    const y = jump * (0.85 + 0.3 * p.ph) + jitter;
    const dx = opt.walk ? Math.sin(p.ph * 30) * opt.walk : 0;
    sv.set(s, s, s);
    v.set(p.x + dx, y + 0.52 * s, p.z); m.compose(v, q, sv); cBody.setMatrixAt(i, m);
    v.set(p.x + dx, y + 1.2 * s, p.z); m.compose(v, q, sv); cHead.setMatrixAt(i, m);
    // braços: pra cima no pulo / comemorando
    const up = clamp(opt.arms ?? 0);
    e.set(0, 0, (hash(i + 1) > .5 ? 1 : -1) * lerp(0.15, 2.7, up)); q.setFromEuler(e);
    const side = hash(i + 1) > .5 ? 1 : -1, ang = lerp(0.15, 2.7, up);
    v.set(p.x + dx + side * (0.2 + Math.sin(ang) * 0.22) * s, y + (0.95 - Math.cos(ang) * 0.22 + (up > .5 ? 0.0 : 0)) * s, p.z); m.compose(v, q, sv); cArm.setMatrixAt(i, m);
    q.identity();
  }
  cBody.instanceMatrix.needsUpdate = cHead.instanceMatrix.needsUpdate = cArm.instanceMatrix.needsUpdate = true;
}

// ================= porta-aviões (instanciados no gramado) =================
const NPA = 100;
function carrierGeo() {
  const parts = [[new THREE.BoxGeometry(2.0, 1.0, 9), [0.42, 0.45, 0.5], [0, 0.5, 0]], [new THREE.BoxGeometry(2.6, 0.18, 9.4), [0.32, 0.34, 0.37], [0.2, 1.09, 0]], [new THREE.BoxGeometry(0.5, 1.2, 1.4), [0.55, 0.57, 0.6], [1.15, 1.8, 0.8]], [new THREE.BoxGeometry(0.06, 0.01, 7.5), [0.95, 0.95, 0.95], [0.2, 1.19, 0]]];
  const pos = [], nor = [], col = [];
  for (const [g0, c, o] of parts) { const g = g0.toNonIndexed(); g.translate(...o); pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); for (let i = 0; i < g.attributes.position.count; i++) col.push(...c); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); return g;
}
const carriers = new THREE.InstancedMesh(carrierGeo(), M(0xFFFFFF, { vertexColors: true }), NPA); carriers.castShadow = true; carriers.frustumCulled = false; scene.add(carriers);
const PA_X0 = 128;
function drawCarriers(t, t0) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  for (let i = 0; i < NPA; i++) {
    const k = t0 == null ? 0 : clamp((t - t0 - (i % 10) * 0.03 - Math.floor(i / 10) * 0.07) / 0.45);
    if (k <= 0) { m.makeScale(0, 0, 0); carriers.setMatrixAt(i, m); continue; }
    const ix = i % 10, iz = Math.floor(i / 10);
    const kk = t0 == null ? 0 : spring(t - t0 - (i % 10) * 0.03 - Math.floor(i / 10) * 0.07, 1.6, 0.55); v.set(PA_X0 + ix * 7.4, 30 * (1 - kk), 10 - iz * 21); s.setScalar(2); m.compose(v, q, s); carriers.setMatrixAt(i, m);
  }
  carriers.instanceMatrix.needsUpdate = true;
}

// ================= estradas + engarrafamento =================
const roads = new THREE.Group(); scene.add(roads);
{ const asph = M(0x3A3A40), lineM = new THREE.MeshBasicMaterial({ color: 0xF4F1EA });
  for (const x of [-12, 12]) { const r = box(5, 0.04, 400, asph); r.position.set(x, 0.02, 160); roads.add(r); for (let z = -30; z < 360; z += 4) { const l = box(0.15, 0.05, 1.6, lineM); l.position.set(x, 0.045, z); roads.add(l); } }
  const r2 = box(400, 0.04, 5, asph); r2.position.set(0, 0.021, 8); roads.add(r2); }
roads.visible = false;
const NCAR = 360;
function carGeo() {
  const parts = [[new THREE.BoxGeometry(1.0, 0.45, 2.0), null, [0, 0.35, 0]], [new THREE.BoxGeometry(0.85, 0.35, 1.0), [0.75, 0.88, 0.95], [0, 0.75, -0.1]], [new THREE.BoxGeometry(0.9, 0.12, 0.05), [1.0, 0.1, 0.1], [0, 0.42, 1.0]]];
  const pos = [], nor = [], col = [], tint = [];
  for (const [g0, c, o] of parts) { const g = g0.toNonIndexed(); g.translate(...o); pos.push(...g.attributes.position.array); nor.push(...g.attributes.normal.array); for (let i = 0; i < g.attributes.position.count; i++) { col.push(...(c || [1, 1, 1])); } }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); return g;
}
const cars = new THREE.InstancedMesh(carGeo(), M(0xFFFFFF, { vertexColors: true }), NCAR); cars.castShadow = true; cars.frustumCulled = false; scene.add(cars);
const carSlots = [];
{ const c = new THREE.Color(); const cc = [0xE0383E, 0x3D7CC9, 0xF4F1EA, 0x222222, 0xF2A33A, 0x1E9E52, 0x9AA0A8];
  for (let i = 0; i < NCAR; i++) {
    const lane = i % 4, k = Math.floor(i / 4);
    if (lane < 2) carSlots.push({ x: -12 + (lane ? 1.2 : -1.2), z: 4 + k * 2.6, ry: 0 });
    else carSlots.push({ x: 12 + (lane === 3 ? 1.2 : -1.2), z: 4 + k * 2.6, ry: 0 });
    cars.setColorAt(i, c.setHex(cc[Math.floor(hash(i + 21) * cc.length)]));
  }
  cars.instanceColor.needsUpdate = true; }
function drawCars(t, t0) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < NCAR; i++) {
    const p = carSlots[i], k = t0 == null ? 0 : clamp((t - t0 - Math.floor(i / 4) * 0.012) / 0.35);
    if (k <= 0) { m.makeScale(0, 0, 0); cars.setMatrixAt(i, m); continue; }
    const creep = Math.max(0, Math.sin(t * 2 + i * 0.7)) * 0.05;
    v.set(p.x, 6 * (1 - spring(t - t0 - Math.floor(i / 4) * 0.012, 1.8, 0.55)), p.z - creep); q.setFromEuler(new THREE.Euler(0, (hash(i) - .5) * 0.15, 0)); m.compose(v, q, s); cars.setMatrixAt(i, m);
  }
  cars.instanceMatrix.needsUpdate = true;
}

// ================= poeira do impacto =================
const ND = 70;
const dust = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.5, 0), M(0xD9CBB0, { transparent: true, opacity: 0.7 }), ND); scene.add(dust);
function drawDust(t, t0) {
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  const u = t0 == null ? -1 : (t - t0) / 2.2;
  for (let i = 0; i < ND; i++) {
    if (u < 0 || u > 1) { m.makeScale(0, 0, 0); dust.setMatrixAt(i, m); continue; }
    const a = hash(i) * Math.PI * 2, r = 2 + easeOut(u) * (8 + hash(i + 2) * 10);
    v.set(Math.cos(a) * r * 1.6, 0.3 + easeOut(u) * (0.5 + hash(i + 4) * 1.6), -8 - Math.abs(Math.sin(a)) * r * 0.8);
    s.setScalar((0.6 + hash(i + 6)) * (1.0 + 1.8 * u) * (1 - u * 0.6)); m.compose(v, q, s); dust.setMatrixAt(i, m);
  }
  dust.material.opacity = 0.75 * (1 - clamp(u));
  dust.instanceMatrix.needsUpdate = true;
}

// ================= boneco (capacete + colete + bigode + megafone) =================
const SKIN = 0xE3B08C;
function person() {
  const g = new THREE.Group(), P = {};
  const body = new THREE.Group(); g.add(body); P.body = body;
  for (const sx of [-1, 1]) { const leg = box(0.17, 0.86, 0.2, M(0x2F3A56)); leg.position.set(sx * 0.11, 0.43, 0); g.add(leg); const sh = box(0.19, 0.1, 0.28, M(0x3B2A20)); sh.position.set(sx * 0.11, 0.05, 0.04); g.add(sh); }
  const torso = box(0.5, 0.66, 0.28, M(0x3D7CC9)); torso.position.y = 1.19; body.add(torso);
  const vest = box(0.52, 0.5, 0.3, M(0xFF8A1E)); vest.position.y = 1.2; body.add(vest);
  const stripe = box(0.53, 0.05, 0.31, M(0xF4F4F4)); stripe.position.y = 1.12; body.add(stripe);
  for (const sx of [-1, 1]) {
    const piv = new THREE.Group(); piv.position.set(sx * 0.32, 1.47, 0);
    const arm = box(0.13, 0.62, 0.15, M(0x3D7CC9)); arm.position.y = -0.31; piv.add(arm);
    const hand = box(0.12, 0.12, 0.13, M(SKIN)); hand.position.y = -0.66; piv.add(hand);
    g.add(piv); P[sx < 0 ? "armL" : "armR"] = piv;
  }
  const head = new THREE.Group(); head.position.y = 1.68; g.add(head); P.head = head;
  const hd = new THREE.Mesh(new THREE.SphereGeometry(0.155, 14, 10), M(SKIN)); hd.scale.set(1, 1.15, 1); hd.castShadow = true; head.add(hd);
  for (const sx of [-1, 1]) { const e = box(0.035, 0.04, 0.02, M(0x111111)); e.position.set(sx * 0.055, 0.03, 0.15); head.add(e); }
  const mouth = box(0.07, 0.02, 0.02, M(0x7A2E2E)); mouth.position.set(0, -0.06, 0.15); head.add(mouth); P.mouth = mouth;
  const mus = box(0.14, 0.03, 0.03, M(0x3A2618)); mus.position.set(0, -0.025, 0.155); head.add(mus);
  const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.175, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2), M(0xFFD21F)); helmet.position.y = 0.05; head.add(helmet);
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.025, 16), M(0xFFD21F)); brim.position.set(0, 0.05, 0.03); head.add(brim);
  // megafone na mão direita
  const meg = new THREE.Group(); const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.16, 0.34, 10, 1, true), M(0xF4F4F4, { side: THREE.DoubleSide })); cone.rotation.x = Math.PI / 2; cone.position.z = 0.17; meg.add(cone);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.02, 6, 14), M(0xE0383E)); ring.position.z = 0.34; meg.add(ring);
  meg.position.set(0, -0.7, 0.05); meg.rotation.x = Math.PI / 2; P.armR.add(meg); P.meg = meg;
  g.userData.P = P; return g;
}
const guy = person(); guy.scale.setScalar(1.15); scene.add(guy);
function pose(P, o) { P.armR.rotation.set(o.rx || 0, 0, o.rz ?? 0.05); P.armL.rotation.set(o.lx || 0, 0, o.lz ?? -0.05); P.head.rotation.set(o.hx || 0, o.hy || 0, 0); }

// ================= cena 2: planeta Terra =================
const scene2 = new THREE.Scene(); scene2.background = new THREE.Color(0x0B1230);
const cam2 = new THREE.PerspectiveCamera(42, W / H, 0.1, 500);
scene2.add(new THREE.HemisphereLight(0xDDE8FF, 0x223355, 1.1));
const sun2 = new THREE.DirectionalLight(0xFFF1D8, 2.6); sun2.position.set(6, 8, 10); scene2.add(sun2);
{ const N = 600, pos = []; for (let i = 0; i < N; i++) { const a = hash(i) * Math.PI * 2, b = Math.acos(2 * hash(i + 99) - 1), r = 120; pos.push(r * Math.sin(b) * Math.cos(a), r * Math.cos(b), r * Math.sin(b) * Math.sin(a)); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); scene2.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xFFFFFF, size: 0.6 }))); }
const R = 5;
const globe = new THREE.Group(); scene2.add(globe);
{ const g = new THREE.IcosahedronGeometry(R, 3).toNonIndexed(); const p = g.attributes.position, col = [];
  for (let i = 0; i < p.count; i += 3) {
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3, cy = (p.getY(i) + p.getY(i + 1) + p.getY(i + 2)) / 3, cz = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3;
    const n = Math.sin(cx * 0.9) * Math.cos(cz * 0.8) + Math.sin(cy * 1.3 + cx * 0.4) * 0.7;
    const land = n > 0.25 || cy > 3.2;   // topo (onde fica o "Brasil") sempre é terra
    const c = cy > 4.6 && Math.abs(cx) < 1.2 && Math.abs(cz) < 1.2 ? [0.55, 0.72, 0.30] : land ? (cy < -4.5 ? [0.95, 0.97, 1.0] : [0.36, 0.62, 0.30]) : [0.20, 0.45, 0.80];
    for (let k = 0; k < 3; k++) col.push(...c);
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3)); g.computeVertexNormals();
  const earth = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9 })); globe.add(earth); }
// gente no topo do planeta (exagerada de tamanho)
const NG2 = 260;
const g2Body = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.05, 0.06, 0.3, 5), M(0xFFFFFF), NG2);
const g2Head = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.045, 0), M(0xE3B08C), NG2);
globe.add(g2Body, g2Head); g2Body.frustumCulled = g2Head.frustumCulled = false;
const g2 = [];
{ const c = new THREE.Color(); for (let i = 0; i < NG2; i++) { const a = hash(i + 4) * Math.PI * 2, r = Math.sqrt(hash(i + 40)); g2.push({ a, r }); g2Body.setColorAt(i, c.set(SHIRTS[i % SHIRTS.length])); } g2Body.instanceColor.needsUpdate = true; }
function drawGlobePeople(spread, jump, count) {
  // spread: raio angular do grupo (rad); jump: altura do pulo
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), v = new THREE.Vector3(), n = new THREE.Vector3(), s = new THREE.Vector3(1, 1, 1);
  for (let i = 0; i < NG2; i++) {
    if (i >= count) { m.makeScale(0, 0, 0); g2Body.setMatrixAt(i, m); g2Head.setMatrixAt(i, m); continue; }
    const p = g2[i], th = p.r * spread;
    n.set(Math.sin(th) * Math.cos(p.a), Math.cos(th), Math.sin(th) * Math.sin(p.a)).normalize();
    q.setFromUnitVectors(up, n);
    const h = jump * (0.8 + 0.4 * hash(i + 3));
    v.copy(n).multiplyScalar(R + 0.15 + h); m.compose(v, q, s); g2Body.setMatrixAt(i, m);
    v.copy(n).multiplyScalar(R + 0.34 + h); m.compose(v, q, s); g2Head.setMatrixAt(i, m);
  }
