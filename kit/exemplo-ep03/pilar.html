const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; };
function spring(t, f = 1.6, z = 0.6) { if (t <= 0) return 0; const w = 2*Math.PI*f, wd = w*Math.sqrt(1-z*z); return 1 - Math.exp(-z*w*t)*(Math.cos(wd*t) + (z*w/wd)*Math.sin(wd*t)); }
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
// tempo (s) em que a palavra que começa com `w` é falada dentro do trecho `seg`
function wordTime(seg, w, nth = 0) {
  const list = TL.words.filter(x => x.seg === seg && x.w.toLowerCase().replace(/[^a-zà-ú0-9]/g, "").startsWith(w));
  return list.length ? list[Math.min(nth, list.length - 1)].s : null;
}

function crack(x0, y0, z, dirx, n, seed) {
  const g = new THREE.Group(); let x = x0, y = y0;
  for (let i = 0; i < n; i++) {
    const len = 0.18 + hash(seed + i) * 0.16, ang = (dirx > 0 ? 0.9 : Math.PI - 0.9) + (hash(seed * 3 + i) - 0.5) * 0.9;
    const s = new THREE.Mesh(new THREE.BoxGeometry(len, 0.035, 0.02), new THREE.MeshBasicMaterial({ color: 0x2B1E18 }));
    s.position.set(x + Math.cos(ang) * len / 2, y + Math.sin(ang) * len / 2, z); s.rotation.z = ang; s.visible = false; g.add(s);
    x += Math.cos(ang) * len; y += Math.sin(ang) * len;
  }
  g.userData.x = x0; walls.add(g); cracks.push(g); return g;
}

for (const x of X) for (const z of Z) {

}
function polyPoint(pts, u) {
  const L = []; let tot = 0; for (let i = 0; i < pts.length - 1; i++) { const d = Math.hypot(...pts[i + 1].map((v, k) => v - pts[i][k])); L.push(d); tot += d; }
  let s = u * tot; for (let i = 0; i < L.length; i++) { if (s <= L[i]) { const k = s / L[i]; return pts[i].map((v, j) => lerp(v, pts[i + 1][j], k)); } s -= L[i]; }
  return pts[pts.length - 1];
}
function drawArrows(t, alpha) {
  arrows.visible = alpha > 0.01; if (!arrows.visible) return;
  const m = new THREE.Matrix4(), q = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI, 0, 0)); let n = 0;
  loadPaths.forEach((p, pi) => { for (let k = 0; k < 6; k++) { const u = ((t * 0.32 + k / 6 + pi * 0.07) % 1); const v = polyPoint(p, u); const s = alpha * (0.7 + 0.3 * Math.sin(u * Math.PI)); m.compose(new THREE.Vector3(...v), q, new THREE.Vector3(s, s, s)); arrows.setMatrixAt(n++, m); } });
  for (; n < 240; n++) { m.makeScale(0, 0, 0); arrows.setMatrixAt(n, m); }
  arrows.instanceMatrix.needsUpdate = true;
}

const NDUST = 120;
const dust = new THREE.InstancedMesh(new THREE.BoxGeometry(0.12, 0.12, 0.12), M(0xD8CFC2), NDUST); scene.add(dust);
function drawDust(t, t0, origin, spread = 1) {
  const m = new THREE.Matrix4(); const k = t - t0;
  for (let i = 0; i < NDUST; i++) {
    if (k < 0 || k > 2.2) { m.makeScale(0, 0, 0); dust.setMatrixAt(i, m); continue; }
    const a = hash(i) * Math.PI * 2, sp = (0.6 + hash(i + 7) * 1.8) * spread, up = 0.5 + hash(i + 13) * 1.6;

  }

}
